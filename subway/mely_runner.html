<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Mely Runner</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #1a1033; overflow: hidden; overscroll-behavior: none; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; font-family: 'Press Start 2P', monospace; color: #fff; user-select: none; -webkit-user-select: none; }
  #wrap { position: relative; height: min(100dvh, 177.78vw); aspect-ratio: 9 / 16; }
  canvas { width: 100%; height: 100%; display: block; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 22px; padding: 8%; background: rgba(26, 16, 51, .88); }
  .screen.hide { display: none; }
  h1 { font-size: clamp(22px, 8vw, 38px); line-height: 1.4; color: #ff5fa8; text-shadow: 4px 4px 0 #ffd23f; }
  p { font-size: clamp(8px, 2.8vw, 12px); line-height: 2.1; }
  .big { font-size: clamp(14px, 4.6vw, 22px); color: #ffd23f; }
  button { font-family: inherit; font-size: clamp(12px, 4vw, 18px); padding: 16px 26px; background: #ff5fa8; color: #fff; border: 4px solid #fff; box-shadow: 0 6px 0 #a8326f; }
  button:active { transform: translateY(4px); box-shadow: 0 2px 0 #a8326f; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="360" height="640"></canvas>

  <div class="screen" id="start">
    <h1>MELY<br>RUNNER</h1>
    <p>¡Corre por la ciudad y recoge tacos!<br>Desliza ⬅ ➡ para cambiar de carril<br>Desliza ⬆ (o toca) para saltar<br>Salta las vallas y esquiva los brócolis</p>
    <button id="play">CORRER</button>
  </div>

  <div class="screen hide" id="over">
    <h1>¡AUCH!</h1>
    <p id="msg"></p>
    <p class="big" id="score"></p>
    <button id="again">OTRA VEZ</button>
  </div>
</div>

<script>
const cv = document.getElementById('c'), g = cv.getContext('2d');
const W = 360, H = 640, HZ = 210, PT = 0.86;
const laneW = t => 26 + 84 * t;
const laneX = (l, t) => W / 2 + (l - 1) * laneW(t);
const yAt = t => HZ + (H - HZ) * t;

/* Sonido sin archivos */
let ac = null;
function beep(f, d = .1, type = 'square', v = .05) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), a = ac.createGain();
    o.type = type; o.frequency.value = f; a.gain.value = v;
    o.connect(a); a.connect(ac.destination); o.start();
    a.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + d); o.stop(ac.currentTime + d);
  } catch (e) {}
}

/* Sprite pixel art de Mely */
const PAL = { H: '#4a2c1a', S: '#f5c9a0', B: '#ff5fa8', P: '#3b3b8f', Z: '#ffffff', E: '#222', K: '#ffd23f' };
const TOP = [
  '...HHHHHH...', '..HHHHHHHH..', '.HHSSSSSSHH.', '.HHSESSESHH.',
  '.HHSSSSSSHH.', '..HSSSSSSH..', '..BBBBBBBB..', '.BBBBKKBBBB.',
  '.SBBBBBBBBS.', '.SBBBBBBBBS.', '..BBBBBBBB..', '..PPPPPPPP..'
];
const LEGS = [
  ['..PPP..PPP..', '..PPP..PPP..', '..ZZZ..ZZZ..'],
  ['...PPPPPP...', '..PP....PP..', '..ZZ....ZZ..']
];
function drawSprite(cx, by, ps, f, alpha) {
  const rows = TOP.concat(LEGS[f]);
  g.globalAlpha = alpha;
  rows.forEach((r, y) => {
    for (let x = 0; x < 12; x++) {
      const c = r[x];
      if (c === '.') continue;
      g.fillStyle = PAL[c];
      g.fillRect(Math.round(cx + (x - 6) * ps), Math.round(by - (rows.length - y) * ps), Math.ceil(ps), Math.ceil(ps));
    }
  });
  g.globalAlpha = 1;
}

/* Estado */
let st, items, p, buildings = [], running = false, last = 0, toast = '', toastT = 0, shake = 0;
let best = 0;
try { best = parseInt(localStorage.getItem('mely_best')) || 0; } catch (e) {}
for (let i = 0; i < 18; i++) buildings.push({ x: i * 22 - 10, w: 18 + Math.random() * 14, h: 30 + Math.random() * 90, c: Math.random() < .5 ? '#3a2466' : '#2d1b55' });

const FRASES = { 200: '¡Vas volando, Mely!', 500: 'Ya pareces de Subway Surfers', 1000: 'Leyenda urbana del taco', 2000: 'Imparable. Temible.' };
const FINALES = ['Te ha frenado un brócoli. Nadie lo vio venir.', 'Esa valla estaba ahí desde siempre...', 'Casi, casi. Otra vez.', 'El taco de la victoria te espera.', 'Tropezar también es correr.'];

function reset() {
  st = { dist: 0, donuts: 0, lives: 3, v: .38, spawn: 0, anim: 0, inv: 0 };
  items = [];
  p = { lane: 1, lx: 1, jt: -1 };
  toast = ''; toastT = 0; shake = 0;
}
const jz = () => p.jt < 0 ? 0 : Math.sin(Math.PI * p.jt / .7);
const score = () => Math.floor(st.dist) + st.donuts * 10;
function say(t) { toast = t; toastT = 2; }

function spawnRow() {
  const r = Math.random(), lane = Math.floor(Math.random() * 3);
  if (r < .2) {
    for (let i = 0; i < 3; i++) items.push({ k: 'd', l: lane, t: -i * .09 });
  } else if (r < .55) {
    items.push({ k: 'v', l: lane, t: 0 });
    if (Math.random() < .3) items.push({ k: 'd', l: (lane + 1) % 3, t: 0 });
  } else {
    const free = Math.floor(Math.random() * 3);
    for (let l = 0; l < 3; l++) {
      if (l === free) { if (Math.random() < .35) items.push({ k: 'd', l, t: 0 }); }
      else if (Math.random() < .85) items.push({ k: 'b', l, t: 0 });
    }
  }
}

function update(dt) {
  st.v = .38 + st.dist / 3000;
  st.dist += st.v * 40 * dt;
  st.anim += dt * 9;
  st.spawn -= dt * st.v / .38;
  if (st.spawn <= 0) { spawnRow(); st.spawn = 1.2 + Math.random() * .5; }
  p.lx += (p.lane - p.lx) * Math.min(1, dt * 14);
  if (p.jt >= 0) { p.jt += dt; if (p.jt > .7) p.jt = -1; }
  if (st.inv > 0) st.inv -= dt;
  if (shake > 0) shake -= dt;
  if (toastT > 0) toastT -= dt;

  const before = score();
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    const pt = it.t;
    it.t += st.v * dt * (.3 + Math.max(0, it.t) * 1.6);
    if (it.t > 1.15) { items.splice(i, 1); continue; }
    if (it.t < PT - .045 || pt > PT + .045 || Math.abs(it.l - p.lx) > .55) continue;
    if (it.k === 'd') {
      items.splice(i, 1); st.donuts++; beep(700 + (st.donuts % 5) * 80, .08);
    } else if (st.inv <= 0 && (it.k === 'b' || jz() < .4)) {
      st.lives--; st.inv = 1.3; shake = .25; beep(120, .3, 'sawtooth', .09);
      say(it.k === 'b' ? '¡ARGH, BRÓCOLI!' : '¡Ay, la valla!');
      if (st.lives <= 0) return gameOver();
    }
  }
  const now = score();
  for (const k in FRASES) if (before < k && now >= k) say(FRASES[k]);
}

function poly(pts, col) { g.fillStyle = col; g.beginPath(); pts.forEach((q, i) => i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1])); g.closePath(); g.fill(); }

function draw() {
  g.save();
  if (shake > 0) g.translate((Math.random() - .5) * 10, (Math.random() - .5) * 10);
  // cielo
  const gr = g.createLinearGradient(0, 0, 0, HZ);
  gr.addColorStop(0, '#2a1458'); gr.addColorStop(1, '#ff8fb8');
  g.fillStyle = gr; g.fillRect(0, 0, W, HZ);
  g.fillStyle = '#ffd23f'; g.beginPath(); g.arc(W / 2, HZ - 40, 34, 0, 7); g.fill();
  buildings.forEach(b => { g.fillStyle = b.c; g.fillRect(b.x, HZ - b.h, b.w, b.h); });
  // suelo y carretera
  g.fillStyle = '#2d1b55'; g.fillRect(0, HZ, W, H - HZ);
  poly([[W / 2 - laneW(0) * 1.5, HZ], [W / 2 + laneW(0) * 1.5, HZ], [W / 2 + laneW(1) * 1.5, H], [W / 2 - laneW(1) * 1.5, H]], '#4b4b63');
  g.strokeStyle = '#ffd23f'; g.lineWidth = 3;
  [-1.5, 1.5].forEach(e => { g.beginPath(); g.moveTo(W / 2 + e * laneW(0), HZ); g.lineTo(W / 2 + e * laneW(1), H); g.stroke(); });
  // rayas que avanzan
  const off = (st.dist * .02) % 1;
  for (let k = 0; k < 10; k++) {
    const t0 = (k + off) / 10, t1 = t0 + .05;
    const a = Math.pow(t0, 1.5), b = Math.pow(t1, 1.5);
    [-.5, .5].forEach(e => {
      g.lineWidth = 1 + 5 * b; g.strokeStyle = '#e8e8f4';
      g.beginPath(); g.moveTo(W / 2 + e * laneW(a), yAt(a)); g.lineTo(W / 2 + e * laneW(b), yAt(b)); g.stroke();
    });
  }
  // objetos
  const vis = items.filter(i => i.t >= 0).sort((a, b) => a.t - b.t);
  const pl = () => {
    const s = .3 + .7 * PT, x = laneX(p.lx, PT), y = yAt(PT), h = jz() * 70 * s;
    g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.ellipse(x, y, 26 * s * (1 - jz() * .3), 7 * s, 0, 0, 7); g.fill();
    const blink = st.inv > 0 && Math.floor(st.inv * 12) % 2;
    drawSprite(x, y - h, 5 * s, jz() > 0 ? 0 : Math.abs(Math.floor(st.anim)) % 2, blink ? .35 : 1);
  };
  let drawnP = false;
  vis.forEach(it => {
    if (!drawnP && it.t > PT) { pl(); drawnP = true; }
    const s = .3 + .7 * it.t, x = laneX(it.l, it.t), y = yAt(it.t), w = laneW(it.t);
    if (it.k === 'd') {
      const r = 17 * s * 1.3, cy = y - r * 1.1;
      g.fillStyle = '#51cf66'; for (let i = -2; i <= 2; i++) { g.beginPath(); g.arc(x + i * r * .36, cy - r * .55, r * .24, 0, 7); g.fill(); }
      g.fillStyle = '#e63946'; g.beginPath(); g.arc(x - r * .25, cy - r * .5, r * .18, 0, 7); g.fill();
      g.fillStyle = '#f4b942'; g.beginPath(); g.arc(x, cy, r, Math.PI, 0); g.fill();
      g.fillStyle = '#d99a2b'; g.fillRect(x - r, cy - 1 * s, r * 2, 2 * s);
      g.fillStyle = '#fff4d6'; g.fillRect(x - r * .4, cy - r * .7, r * .25, 2 * s); g.fillRect(x + r * .2, cy - r * .55, r * .25, 2 * s);
    } else if (it.k === 'v') {
      const bw = w * .85, bh = 30 * s * 1.5;
      g.fillStyle = '#333'; g.fillRect(x - bw / 2, y - bh, 4 * s, bh); g.fillRect(x + bw / 2 - 4 * s, y - bh, 4 * s, bh);
      for (let i = 0; i < 6; i++) { g.fillStyle = i % 2 ? '#fff' : '#e63946'; g.fillRect(x - bw / 2 + i * bw / 6, y - bh, bw / 6, bh * .5); }
    } else {
      const bw = w * .8, bh = 78 * s * 1.5;
      g.fillStyle = '#2f9e44'; g.fillRect(x - bw / 2, y - bh, bw, bh);
      g.fillStyle = '#51cf66'; g.fillRect(x - bw / 2, y - bh, bw, bh * .22);
      g.fillStyle = '#fff'; g.fillRect(x - bw * .3, y - bh * .7, bw * .2, bh * .14); g.fillRect(x + bw * .1, y - bh * .7, bw * .2, bh * .14);
      g.fillStyle = '#111'; g.fillRect(x - bw * .22, y - bh * .66, bw * .08, bh * .08); g.fillRect(x + bw * .18, y - bh * .66, bw * .08, bh * .08);
      g.fillRect(x - bw * .25, y - bh * .4, bw * .5, bh * .06);
    }
  });
  if (!drawnP) pl();

  // HUD
  g.textBaseline = 'middle';
  g.font = '14px "Press Start 2P", monospace'; g.fillStyle = '#fff'; g.textAlign = 'left';
  g.fillText(score() + ' m', 14, 30);
  g.fillStyle = '#ff5fa8'; g.fillText('♥'.repeat(Math.max(0, st.lives)), 14, 56);
  g.textAlign = 'right'; g.fillStyle = '#ffd23f'; g.fillText('REC ' + best, W - 14, 30);
  g.fillStyle = '#fff'; g.fillText('🌮 ' + st.donuts, W - 14, 56);
  if (toastT > 0) {
    g.textAlign = 'center'; g.font = '13px "Press Start 2P", monospace';
    g.fillStyle = 'rgba(26,16,51,.85)'; g.fillRect(20, 110, W - 40, 40);
    g.fillStyle = '#ffd23f'; g.fillText(toast, W / 2, 130);
  }
  g.restore();
}

function loop(ts) {
  if (!running) return;
  const dt = Math.max(0, Math.min(.05, (ts - last) / 1000 || 0)); last = ts;
  update(dt);
  if (running) draw();
  requestAnimationFrame(loop);
}

function gameOver() {
  running = false;
  beep(220, .2, 'triangle', .08); setTimeout(() => beep(150, .4, 'triangle', .08), 200);
  const s = score(), nuevo = s > best;
  if (nuevo) { best = s; try { localStorage.setItem('mely_best', best); } catch (e) {} }
  document.getElementById('msg').textContent = FINALES[Math.floor(Math.random() * FINALES.length)];
  document.getElementById('score').textContent = s + ' m' + (nuevo ? ' ¡RÉCORD!' : '');
  document.getElementById('over').classList.remove('hide');
}

function start() {
  if (document.activeElement) document.activeElement.blur();
  if (running) return;
  document.getElementById('start').classList.add('hide');
  document.getElementById('over').classList.add('hide');
  beep(660, .1); reset(); running = true; last = performance.now(); requestAnimationFrame(loop);
}
document.getElementById('play').onclick = start;
document.getElementById('again').onclick = start;

/* Controles: deslizar o tocar, y teclado */
const act = {
  left: () => { if (running && p.lane > 0) { p.lane--; beep(300, .05); } },
  right: () => { if (running && p.lane < 2) { p.lane++; beep(300, .05); } },
  jump: () => { if (running && p.jt < 0) { p.jt = 0; beep(480, .12, 'triangle'); } }
};
let sx = 0, sy = 0, sw = false;
addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; sw = false; }, { passive: true });
addEventListener('touchmove', e => {
  if (sw) return;
  const dx = e.touches[0].clientX - sx, dy = e.touches[0].clientY - sy;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 28) return;
  sw = true;
  if (Math.abs(dx) > Math.abs(dy)) dx > 0 ? act.right() : act.left();
  else if (dy < 0) act.jump();
}, { passive: true });
addEventListener('touchend', () => { if (!sw) act.jump(); });
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') act.left();
  if (e.key === 'ArrowRight' || e.key === 'd') act.right();
  if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w') act.jump();
});
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

reset(); draw();
</script>
</body>
</html>
