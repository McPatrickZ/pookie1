  ctx.fillStyle='#55ccbb'; ctx.fillRect(-12,2,24,22);
  ctx.fillStyle='#ff3300';
  ctx.beginPath(); ctx.moveTo(-12,4); ctx.lineTo(-16,-6); ctx.lineTo(-8,4); ctx.fill();

  ctx.beginPath(); ctx.moveTo(2,2); ctx.lineTo(0,-12); ctx.lineTo(8,2); ctx.fill();

  ctx.fillStyle='#ff6600';

  ctx.fillStyle='#000'; ctx.fillRect(-9,8,7,7);
  ctx.fillStyle='#00ffcc'; ctx.fillRect(-8,9,5,5);

  ctx.fillStyle='#550000'; ctx.fillRect(2,7,9,9);
  ctx.fillStyle='#ff0000'; ctx.fillRect(3,8,7,7);

// ── FONDO ──
let bgTick=0;
const stars=[];
for(let i=0;i<60;i++) stars.push({x:Math.random()*640,y:Math.random()*200,r:Math.random()*1.5+0.5,s:Math.random()*0.5+0.3});
const waterDrops=[];
for(let i=0;i<25;i++) waterDrops.push({x:Math.random()*640,y:Math.random()*180,vy:0.6+Math.random()*0.8,alpha:0.15+Math.random()*0.3});
function drawBackground(){
  bgTick++;
  ctx.fillStyle='#000811'; ctx.fillRect(0,0,640,480);
  const bg=ctx.createLinearGradient(0,0,0,200);
  bg.addColorStop(0,'#000811'); bg.addColorStop(0.4,'#001428'); bg.addColorStop(1,'#002233');
  ctx.fillStyle=bg; ctx.fillRect(0,0,640,200);

  waterDrops.forEach(d=>{ d.y+=d.vy; if(d.y>185) d.y=-10; ctx.fillStyle=`rgba(0,180,255,${d.alpha})`; ctx.fillRect(d.x,d.y,1.5,8); });
  ctx.fillStyle='#0a1520'; ctx.fillRect(0,80,30,130); ctx.fillRect(610,80,30,130);
  ctx.fillStyle='#0d1e2e'; for(let i=0;i<6;i++){ ctx.fillRect(i*5,90+i*4,6,110-i*4); ctx.fillRect(614+i*4,90+i*2,6,110-i*2); }
  const fg=ctx.createLinearGradient(0,195,0,215);

  ctx.strokeStyle='#ff4400'; ctx.lineWidth=1;
  const lg=0.3+0.3*Math.sin(bgTick*0.05);
  ctx.shadowColor='#ff4400'; ctx.shadowBlur=6*lg;
  [[80,200,160,208],[200,196,280,205],[350,202,420,197],[500,198,560,206]].forEach(([x1,y1,x2,y2])=>{ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); });
  ctx.shadowBlur=0;
  const fog=ctx.createLinearGradient(0,160,0,212);
  fog.addColorStop(0,'rgba(0,80,150,0)'); fog.addColorStop(0.5,'rgba(0,80,150,0.08)'); fog.addColorStop(1,'rgba(0,40,100,0.18)');
  ctx.fillStyle=fog; ctx.fillRect(0,160,640,52);
  const aura=ctx.createRadialGradient(320,140,20,320,140,120);
  aura.addColorStop(0,'rgba(0,255,150,0.18)'); aura.addColorStop(0.5,'rgba(0,200,100,0.06)'); aura.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=aura; ctx.fillRect(0,0,640,210);
  ctx.strokeStyle='#00ffaa'; ctx.lineWidth=1.5;
  ctx.globalAlpha=0.35+0.15*Math.sin(bgTick*0.07);
  ctx.beginPath(); ctx.moveTo(0,210); ctx.lineTo(640,210); ctx.stroke();
  ctx.globalAlpha=1;
}

const BOX={x:160,y:215,w:320,h:130};
function drawBox(){
  ctx.fillStyle=BLACK; ctx.fillRect(BOX.x,BOX.y,BOX.w,BOX.h);
  ctx.strokeStyle=WHITE; ctx.lineWidth=4; ctx.strokeRect(BOX.x,BOX.y,BOX.w,BOX.h);
}

let hx=BOX.x+BOX.w/2, hy=BOX.y+BOX.h/2;
let heartColor=RED;
let invincible=false, invTimer=0;
let greenShieldActive=false, greenTimer=0;

function drawHeart(){
  if(invincible&&Math.floor(Date.now()/80)%2===0) return;
  ctx.save();
  ctx.fillStyle=heartColor;
  if(greenShieldActive||arrowPhase||shieldPhase){ ctx.shadowColor='#00ff88'; ctx.shadowBlur=14; }
  ctx.translate(hx,hy);
  if(arrowPhase) ctx.rotate(heartAngle);
  ctx.scale(0.7,0.7);
  ctx.beginPath();
  ctx.moveTo(0,6); ctx.bezierCurveTo(-10,-2,-18,-10,-10,-16);
  ctx.bezierCurveTo(-4,-22,0,-16,0,-12); ctx.bezierCurveTo(0,-16,4,-22,10,-16);
  ctx.bezierCurveTo(18,-10,10,-2,0,6); ctx.fill();
  if(arrowPhase){
    ctx.fillStyle='rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.moveTo(0,-16); ctx.lineTo(-4,-10); ctx.lineTo(4,-10); ctx.fill();
  }
  ctx.restore();
}

// ════════════════════════════════════════════════
//  PATRÓN 4 — ESCUDO CLÁSICO (el que pediste)
//  Corazón verde. Flechas vienen de cualquier lado.
//  PULSA la tecla de la dirección de donde VIENE la flecha para bloquearla.
//  ↑ si viene de arriba, → si de derecha, ↓ si de abajo, ← si de izquierda.
// ════════════════════════════════════════════════
let shieldPhase=false;
let shieldArrows=[];
let shieldPhaseTimer=0;
const SHIELD_PHASE_DURATION=1200;
let shieldWarningActive=false;
let shieldWarningDir=0;
let shieldWarningTimer=0;
const SHIELD_WARN_TICKS=65;
let shieldSpeed=0.75;
let shieldBlockedFlash=0;
// dir 0=arriba, 1=derecha, 2=abajo, 3=izquierda
// La flecha viene de esa dirección y avanza hacia el centro
const SHIELD_DIR_VEC=[[0,1],[-1,0],[0,-1],[1,0]]; // vector de movimiento de la flecha
const SHIELD_DIR_KEY=['ArrowUp','ArrowRight','ArrowDown','ArrowLeft']; // tecla para bloquear

function spawnPattern4(){
  clearPatterns();
  shieldPhase=true;
  shieldPhaseTimer=0;
  shieldSpeed=0.75;
  shieldArrows=[];
  shieldWarningActive=false;
  heartColor=GREEN;
  hx=BOX.x+BOX.w/2; hy=BOX.y+BOX.h/2;
  scheduleShieldArrow(80);
}

function scheduleShieldArrow(delay){
  const id=setTimeout(()=>{
    if(phase!=='enemy'||!shieldPhase) return;
    const dir=Math.floor(Math.random()*4);
    shieldWarningActive=true;
    shieldWarningDir=dir;
    shieldWarningTimer=SHIELD_WARN_TICKS;
    const id2=setTimeout(()=>{
      if(phase!=='enemy'||!shieldPhase) return;
      shieldWarningActive=false;
      fireShieldArrow(dir);
    }, SHIELD_WARN_TICKS*(1000/60));
    patternIntervals.push(id2);
  }, delay);
  patternIntervals.push(id);
}

function fireShieldArrow(dir){
  const cx=BOX.x+BOX.w/2, cy=BOX.y+BOX.h/2;
  const [dvx,dvy]=SHIELD_DIR_VEC[dir];
  let ax,ay;
  if(dir===0){ ax=cx; ay=BOX.y-45; }
  else if(dir===1){ ax=BOX.x+BOX.w+45; ay=cy; }
  else if(dir===2){ ax=cx; ay=BOX.y+BOX.h+45; }
  else { ax=BOX.x-45; ay=cy; }
  shieldArrows.push({x:ax,y:ay,vx:dvx,vy:dvy,dir,dead:false,blocked:false});
}

function updateShieldPhase(){
  if(!shieldPhase) return;
  shieldPhaseTimer++;
  shieldSpeed=0.75+0.5*(shieldPhaseTimer/SHIELD_PHASE_DURATION);
  if(shieldWarningTimer>0) shieldWarningTimer--;

  shieldArrows.forEach(a=>{
    if(a.dead) return;
    a.x+=a.vx*shieldSpeed;
    a.y+=a.vy*shieldSpeed;
    const dx=a.x-hx, dy=a.y-hy;
    if(Math.sqrt(dx*dx+dy*dy)<20&&!invincible){
      const ok=keys[SHIELD_DIR_KEY[a.dir]];
      if(ok){
        a.blocked=true; a.dead=true;
        greenShieldActive=true; greenTimer=35;
        shieldBlockedFlash=28;
      } else {
        pHP=Math.max(0,pHP-7);
        invincible=true; invTimer=55;
        a.dead=true;
      }
      const gap=Math.max(700,1500-shieldPhaseTimer*0.6);
      scheduleShieldArrow(gap);
    }
    if(!a.dead&&(a.x<BOX.x-80||a.x>BOX.x+BOX.w+80||a.y<BOX.y-80||a.y>BOX.y+BOX.h+80)){
      a.dead=true;
      const gap=Math.max(700,1400-shieldPhaseTimer*0.6);
      scheduleShieldArrow(gap);
    }
  });
  shieldArrows=shieldArrows.filter(a=>!a.dead);
  if(invincible){invTimer--;if(invTimer<=0)invincible=false;}
  if(greenShieldActive){greenTimer--;if(greenTimer<=0)greenShieldActive=false;}
  if(shieldBlockedFlash>0) shieldBlockedFlash--;
  if(pHP<=0){gameOver();return;}
  if(shieldPhaseTimer>=SHIELD_PHASE_DURATION) endShieldPhase();
}

function endShieldPhase(){
  shieldPhase=false;
  shieldArrows=[];
  shieldWarningActive=false;
  heartColor=RED;
}

// Dibuja una flecha de escudo (más grande, muy legible)
function drawShieldArrow(a){
  if(a.dead) return;
  ctx.save();
  ctx.translate(a.x,a.y);
  const angMap=[Math.PI/2, Math.PI, -Math.PI/2, 0];
  ctx.rotate(angMap[a.dir]);
  ctx.shadowColor='#00ff88'; ctx.shadowBlur=18;
  ctx.fillStyle='#00ff88';
  ctx.fillRect(-6,-22,12,36);
  ctx.beginPath(); ctx.moveTo(0,-38); ctx.lineTo(-14,-22); ctx.lineTo(14,-22); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.35)';
  ctx.fillRect(-4,-22,4,36);
  ctx.restore();
}

// UI del patrón escudo: indicadores de teclas + aviso + flash de bloqueo
function drawShieldUI(){
  if(!shieldPhase) return;
  // Instrucción
  ctx.save();
  ctx.fillStyle='rgba(0,255,136,0.9)'; font(7); ctx.textBaseline='top';
  ctx.fillText('Pulsa la tecla de donde viene la flecha para bloquear',BOX.x+2,BOX.y+BOX.h+5);

  // Indicadores de teclas en cada lado del box
  const ind=[
    {x:BOX.x+BOX.w/2, y:BOX.y-22, lbl:'↑', k:'ArrowUp'},
    {x:BOX.x+BOX.w+22, y:BOX.y+BOX.h/2, lbl:'→', k:'ArrowRight'},
    {x:BOX.x+BOX.w/2, y:BOX.y+BOX.h+22, lbl:'↓', k:'ArrowDown'},
    {x:BOX.x-22, y:BOX.y+BOX.h/2, lbl:'←', k:'ArrowLeft'},
  ];
  ind.forEach(d=>{
    const pressed=keys[d.k];
    ctx.textAlign='center'; ctx.textBaseline='middle'; font(12);
    ctx.shadowColor=pressed?'#ffffff':'#00ff88';
    ctx.shadowBlur=pressed?20:6;
    ctx.fillStyle=pressed?'#ffffff':'rgba(0,255,136,0.5)';
    ctx.fillText(d.lbl, d.x, d.y);
  });
  ctx.shadowBlur=0;

  // Aviso parpadeante (de qué lado viene)
  if(shieldWarningActive){
    const blink=Math.floor(shieldWarningTimer/5)%2===0;
    if(blink){
      const wl=[
        {x:BOX.x+BOX.w/2, y:BOX.y-42, t:'▼ ↑'},
        {x:BOX.x+BOX.w+10, y:BOX.y+BOX.h/2, t:'◄ →'},
        {x:BOX.x+BOX.w/2, y:BOX.y+BOX.h+42, t:'▲ ↓'},
        {x:BOX.x-10, y:BOX.y+BOX.h/2, t:'► ←'},
      ];
      const w=wl[shieldWarningDir];
      ctx.fillStyle='#ffff00'; ctx.shadowColor='#ffff00'; ctx.shadowBlur=12;
      font(8); ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(w.t, w.x, w.y);
    }
  }
  ctx.textAlign='left'; ctx.shadowBlur=0;

  // Flash de bloqueo exitoso
  if(shieldBlockedFlash>0){
    const al=shieldBlockedFlash/28;
    ctx.fillStyle=`rgba(0,255,136,${al*0.25})`; ctx.fillRect(BOX.x,BOX.y,BOX.w,BOX.h);
    ctx.textAlign='center'; ctx.textBaseline='middle'; font(13);
    ctx.shadowColor='#00ff88'; ctx.shadowBlur=22;
    ctx.fillStyle=`rgba(255,255,255,${al})`;
    ctx.fillText('¡BLOQUEADO!', BOX.x+BOX.w/2, BOX.y+BOX.h/2);
    ctx.textAlign='left'; ctx.shadowBlur=0;
  }
  ctx.restore();
}

// ── DIALOGUE ──
let dlgText='',dlgFull='',dlgTimer=0,dlgDone=false,dlgCB=null;
function startDialogue(text,cb){ dlgFull=text; dlgText=''; dlgTimer=0; dlgDone=false; dlgCB=cb; phase='dialogue'; }
function updateDialogue(){
  if(dlgDone) return;
  dlgTimer++;
  if(dlgTimer%3===0&&dlgText.length<dlgFull.length){
    dlgText+=dlgFull[dlgText.length];
    if(dlgText.length===dlgFull.length){
      dlgDone=true;
      const c=sonidoLetras.cloneNode(); c.volume=0.5; c.play().catch(()=>{});
      if(dlgCB) setTimeout(dlgCB,1600);
    }
  }
}
function drawDialogue(){
  ctx.fillStyle=BLACK; ctx.fillRect(40,348,560,72);
  ctx.strokeStyle=WHITE; ctx.lineWidth=4; ctx.strokeRect(40,348,560,72);
  ctx.fillStyle=WHITE; font(9); ctx.textBaseline='top';
  dlgText.split('\n').forEach((l,i)=>ctx.fillText(l,56,360+i*22));
}

const PMAX=80, BMAX=100;
let pHP=PMAX, bHP=BMAX;

// ── MENU ──
let menuEnabled=false, mx=0, my=0;
const btns=[{x:42,y:448,w:170,h:26,label:'⚔ FIGHT'},{x:232,y:448,w:170,h:26,label:'🎒 ITEM'},{x:422,y:448,w:176,h:26,label:'♡ RENDIDOR'}];
function drawMenu(){
  btns.forEach(b=>{
    const hover=(mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h&&menuEnabled);
    ctx.fillStyle=hover?WHITE:BLACK; ctx.strokeStyle=menuEnabled?WHITE:DKGRAY; ctx.lineWidth=2.5;
    ctx.fillRect(b.x,b.y,b.w,b.h); ctx.strokeRect(b.x,b.y,b.w,b.h);
    ctx.fillStyle=hover?BLACK:(menuEnabled?WHITE:DKGRAY); font(9); ctx.textBaseline='middle';
    ctx.fillText(b.label,b.x+12,b.y+13);
  });
}
C.addEventListener('mousemove',e=>{ const r=C.getBoundingClientRect(); mx=(e.clientX-r.left)*(C.width/r.width); my=(e.clientY-r.top)*(C.height/r.height); });
C.addEventListener('click',e=>{
  const r=C.getBoundingClientRect();
  const cx=(e.clientX-r.left)*(C.width/r.width), cy=(e.clientY-r.top)*(C.height/r.height);
  if(!menuEnabled) return;
  if(cx>=btns[0].x&&cx<=btns[0].x+btns[0].w&&cy>=448&&cy<=474) openFight();

});

let arrowPhase=false;
let smallBox={x:0,y:0,w:0,h:0}, smallBoxTarget={x:0,y:0,w:0,h:0};
const SBOX_W=110, SBOX_H=110;
let heartAngle=0, arrowActive=null, arrowPhaseTimer=0;
const ARROW_PHASE_DURATION=1500;
let arrowSpeed=0.7, arrowWarningActive=false, arrowWarningDir=0, arrowWarningTimer=0;
const WARN_TICKS=55;
const DIR_ENTRY=[[0,1],[-1,0],[0,-1],[1,0]];
const DIR_BLOCK_ANGLE=[-Math.PI/2,Math.PI,Math.PI/2,0];

function spawnPattern3(){
  clearPatterns();
  arrowPhase=true; arrowPhaseTimer=0; arrowSpeed=0.7; arrowActive=null; arrowWarningActive=false;
  heartAngle=0; heartColor=GREEN;
  smallBoxTarget={x:BOX.x+BOX.w/2-SBOX_W/2,y:BOX.y+BOX.h/2-SBOX_H/2,w:SBOX_W,h:SBOX_H};
  smallBox={x:BOX.x,y:BOX.y,w:BOX.w,h:BOX.h};
  hx=BOX.x+BOX.w/2; hy=BOX.y+BOX.h/2;
  scheduleNextArrow(80);
}
function scheduleNextArrow(delay){
  const iv=setTimeout(()=>{
    if(phase!=='enemy'||!arrowPhase) return;
    const dir=Math.floor(Math.random()*4); arrowWarningActive=true; arrowWarningDir=dir; arrowWarningTimer=WARN_TICKS;
    const iv2=setTimeout(()=>{ if(phase!=='enemy'||!arrowPhase) return; arrowWarningActive=false; fireArrow(dir); },WARN_TICKS*(1000/60));
    patternIntervals.push(iv2);
  },delay);
  patternIntervals.push(iv);
}
function fireArrow(dir){
  const cx=smallBox.x+smallBox.w/2, cy=smallBox.y+smallBox.h/2;
  const [dvx,dvy]=DIR_ENTRY[dir];
  let ax,ay;
  if(dir===0){ax=cx;ay=smallBox.y-30;} else if(dir===1){ax=smallBox.x+smallBox.w+30;ay=cy;} else if(dir===2){ax=cx;ay=smallBox.y+smallBox.h+30;} else {ax=smallBox.x-30;ay=cy;}
  arrowActive={x:ax,y:ay,vx:dvx*arrowSpeed,vy:dvy*arrowSpeed,dir,blocked:false,dead:false,alpha:1};
}
function updateArrowPhase(){
  if(!arrowPhase) return;
  arrowPhaseTimer++;
  const lerpF=0.08;
  smallBox.x+=(smallBoxTarget.x-smallBox.x)*lerpF; smallBox.y+=(smallBoxTarget.y-smallBox.y)*lerpF;
  smallBox.w+=(smallBoxTarget.w-smallBox.w)*lerpF; smallBox.h+=(smallBoxTarget.h-smallBox.h)*lerpF;
  hx=Math.max(smallBox.x+12,Math.min(smallBox.x+smallBox.w-12,hx));
  hy=Math.max(smallBox.y+12,Math.min(smallBox.y+smallBox.h-12,hy));
  if(keys['z']||keys['Z']||keys['ArrowLeft']) heartAngle-=0.10;
  if(keys['x']||keys['X']||keys['ArrowRight']) heartAngle+=0.10;
  const spd=1.3;
  if(keys['ArrowUp']) hy=Math.max(smallBox.y+12,hy-spd);
  if(keys['ArrowDown']) hy=Math.min(smallBox.y+smallBox.h-12,hy+spd);
  if(arrowWarningTimer>0) arrowWarningTimer--;
  arrowSpeed=0.7+1.0*(arrowPhaseTimer/ARROW_PHASE_DURATION);
  if(arrowActive&&!arrowActive.dead){
    arrowActive.x+=arrowActive.vx*arrowSpeed; arrowActive.y+=arrowActive.vy*arrowSpeed;
    const dx=arrowActive.x-hx,dy=arrowActive.y-hy,dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<18&&!invincible){
      const ea=DIR_BLOCK_ANGLE[arrowActive.dir]; let diff=heartAngle-ea;
      while(diff>Math.PI) diff-=Math.PI*2; while(diff<-Math.PI) diff+=Math.PI*2;
      if(Math.abs(diff)<0.55){ arrowActive.blocked=true; arrowActive.dead=true; greenShieldActive=true; greenTimer=30; }
      else { pHP=Math.max(0,pHP-7); invincible=true; invTimer=50; arrowActive.dead=true; }
      scheduleNextArrow(Math.max(40,110-Math.floor(arrowPhaseTimer/10))*16); arrowActive=null;
    }
    if(arrowActive&&(arrowActive.x<smallBox.x-50||arrowActive.x>smallBox.x+smallBox.w+50||arrowActive.y<smallBox.y-50||arrowActive.y>smallBox.y+smallBox.h+50)){
      arrowActive.dead=true; arrowActive=null; scheduleNextArrow(Math.max(40,100-Math.floor(arrowPhaseTimer/10))*16);
    }
  }
  if(invincible){invTimer--;if(invTimer<=0)invincible=false;}
  if(greenShieldActive){greenTimer--;if(greenTimer<=0)greenShieldActive=false;}
  if(pHP<=0){gameOver();return;}
  if(arrowPhaseTimer>=ARROW_PHASE_DURATION) endArrowPhase();
}
function endArrowPhase(){ arrowPhase=false; arrowActive=null; arrowWarningActive=false; heartColor=RED; heartAngle=0; smallBox={x:BOX.x,y:BOX.y,w:BOX.w,h:BOX.h}; }
function drawArrow(a){
  if(!a||a.dead) return;
  ctx.save(); ctx.translate(a.x,a.y);
  ctx.rotate([Math.PI/2,Math.PI,-Math.PI/2,0][a.dir]);
  ctx.shadowColor='#00ffaa'; ctx.shadowBlur=14; ctx.fillStyle='#00ff88';
  ctx.fillRect(-5,-20,10,32); ctx.beginPath(); ctx.moveTo(0,-34); ctx.lineTo(-13,-20); ctx.lineTo(13,-20); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.fillRect(-3,-20,3,32);
  ctx.restore();
}
function drawSmallBox(){
  ctx.fillStyle=BLACK; ctx.fillRect(smallBox.x,smallBox.y,smallBox.w,smallBox.h);
  ctx.strokeStyle='#00ff88'; ctx.lineWidth=3; ctx.shadowColor='#00ff88'; ctx.shadowBlur=8;
  ctx.strokeRect(smallBox.x,smallBox.y,smallBox.w,smallBox.h); ctx.shadowBlur=0;
}
function drawArrowWarning(){
  if(!arrowWarningActive) return;
  const cx=smallBox.x+smallBox.w/2, cy=smallBox.y+smallBox.h/2;
  if(!Math.floor(arrowWarningTimer/5)%2===0) return;
  ctx.save(); ctx.fillStyle='#ffff00'; ctx.shadowColor='#ffff00'; ctx.shadowBlur=10;
  font(8); ctx.textBaseline='middle'; ctx.textAlign='center';
  const dirs=[{x:cx,y:smallBox.y-16,txt:'▼'},{x:smallBox.x+smallBox.w+16,y:cy,txt:'◄'},{x:cx,y:smallBox.y+smallBox.h+16,txt:'▲'},{x:smallBox.x-16,y:cy,txt:'►'}];
  const d=dirs[arrowWarningDir]; ctx.fillText(d.txt,d.x,d.y);
  ctx.textAlign='left'; ctx.shadowBlur=0; ctx.restore();
}
function drawHeartAngleHint(){
  if(!arrowPhase) return;
  ctx.save(); ctx.translate(smallBox.x+smallBox.w-16,smallBox.y+16);
  ctx.strokeStyle='rgba(0,255,136,0.5)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle='#00ff88'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(heartAngle)*10,Math.sin(heartAngle)*10); ctx.stroke();
  ctx.restore();
}

            }

            if(arrowPhaseTimer>=ARROW_PHASE_DURATION){
                endArrowPhase(); clearPatterns();
                const msg=BATTLE_MSG[battleMsgIdx%BATTLE_MSG.length]; battleMsgIdx++;
                startDialogue(msg,()=>{ phase='menu'; menuEnabled=true; dlgText='* ¿Qué harás?'; dlgFull='* ¿Qué harás?'; dlgDone=true; });
            }
        } else {
            const spd=1.8;
            if(keys['ArrowLeft']) hx=Math.max(BOX.x+12,hx-spd);
            if(keys['ArrowRight']) hx=Math.min(BOX.x+BOX.w-12,hx+spd);
            if(keys['ArrowUp']) hy=Math.max(BOX.y+12,hy-spd);
            if(keys['ArrowDown']) hy=Math.min(BOX.y+BOX.h-12,hy+spd);
            updateSpears();
            if(pHP<=0){gameOver();return;}
            if(enemyTicks>=enemyDuration){
                clearPatterns();
                const msg=BATTLE_MSG[battleMsgIdx%BATTLE_MSG.length]; battleMsgIdx++;
                startDialogue(msg,()=>{ phase='menu'; menuEnabled=true; dlgText='* ¿Qué harás?'; dlgFull='* ¿Qué harás?'; dlgDone=true; });
            }
        }
    }
    if(fightOpen){ fCursorX+=fCursorDir*3.5; if(fCursorX>=BOX.w-54) fCursorDir=-1; if(fCursorX<=0) fCursorDir=1; }
}

function draw(){
    ctx.clearRect(0,0,640,480);
    drawBackground();
    drawUndyne(320,60,bobY,hitFlash>0,phase,tick);
    drawEnemyHP();
    if(shieldPhase){
        drawBox();
        shieldArrows.forEach(a=>drawShieldArrow(a));
        drawHeart();
        drawShieldUI();
    } else if(arrowPhase){
        drawSmallBox();
        drawArrowWarning();
        drawArrow(arrowActive);
        drawHeart();
        drawHeartAngleHint();
        ctx.fillStyle='rgba(0,255,136,0.7)'; font(7); ctx.textBaseline='top';
        ctx.fillText('Z/X ó ←/→ = GIRAR  |  ↑↓ = MOVER',BOX.x,BOX.y+BOX.h+6);
    } else {
        drawBox();
        if(phase==='enemy'||phase==='menu'||phase==='dialogue'){
            if(!fightOpen&&!subOpen) drawSpears();
            drawHeart();
        }
    }
    drawFightBar();
    drawSubMenu();
    drawDialogue();
    drawHPArea();
    drawMenu();
    // CORRECCIÓN: Si estamos en fase final, dibujar la pantalla
    if(phase==='end') drawEndScreen();
}

function loop(){ update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
