<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Toriel Fight</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
  overflow:hidden;
  position: relative; /* Necesario para posicionar el botón flotante */
}

canvas {
  image-rendering: pixelated;
  display:block;

  /* Escalado visual */
  width: min(95vw, calc(95vh * 1.3333));
  height: auto;
}

/* Botón Volver arriba a la izquierda */
#btn-back {
  position: absolute;
  top: 24px;
  left: 24px;
  background: #000;
  color: #fff;
  border: 3px solid #fff;
  font-family: 'Press Start 2P', monospace;
  font-size: 11px;
  padding: 12px 20px;
  cursor: pointer;
  z-index: 50;
  transition: all 0.2s;
}
#btn-back:hover {
  background: #fff;
  color: #000;
}
</style>
</head>
<body>

<button id="btn-back" onclick="goBackToMap()">◀ VOLVER</button>

<canvas id="c"></canvas>
<script>
// Función para el botón volver
function goBackToMap() {
  musica.pause();

  const sound = new Audio('click.mp3');
  sound.volume = 0.6;
  sound.play().catch(() => {});
  setTimeout(() => {
    window.location.href = 'dificil.html';
  }, 1500); // Pequeño delay de 150ms para que se escuche el click
}

// ═══════════════════════════════════════════════
//  UNDERTALE — TORIEL FIGHT ENGINE (Canvas puro)
// ═══════════════════════════════════════════════
const C = document.getElementById('c');
const ctx = C.getContext('2d');
C.width = 640; C.height = 480;

// ── MÚSICA DEL COMBATE ──
const musica = new Audio('audio_toriel.mp3');
musica.loop = true;
musica.volume = 0.35;

window.addEventListener('click', () => {
  musica.play().catch(() => {});
}, { once:true });

// ── CONFIGURACIÓN DE DINERO ──
function ganarDinero(cantidad) {
    let actual = parseInt(localStorage.getItem('player_gold')) || 0;
    localStorage.setItem('player_gold', actual + cantidad);
}

// Cargar el audio para el final de las frases
const sonidoLetras = new Audio('letras.mp3');
sonidoLetras.volume = 0.5;

// ── FONT helper ──
function font(size) { ctx.font = size+'px "Press Start 2P", monospace'; }

// ── COLORS ──
const WHITE='#fff', BLACK='#000', YELLOW='#ffff00', RED='#ff0000',
      GRAY='#888', DKGRAY='#333', GREEN='#00ff00', ORANGE='#ff8800';

// ═══════════════════════════════════════════════
//  TORIEL SPRITE — dibujada en canvas con formas
// ═══════════════════════════════════════════════
function drawToriel(x, y, bobY, hit) {
  ctx.save();
  ctx.translate(x, y + bobY);
  if(hit) ctx.filter = 'brightness(10)';

  const s = 3.2; // escala
  ctx.scale(s, s);

  // Cuernos
  ctx.fillStyle='#ddd';
  ctx.beginPath(); ctx.moveTo(-18,0); ctx.lineTo(-14,-14); ctx.lineTo(-10,0); ctx.fill();
  ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(14,-14); ctx.lineTo(18,0); ctx.fill();

  // Orejas
  ctx.fillStyle='#e8e4d8';
  ctx.fillRect(-22, 4, 8, 12);
  ctx.fillRect(14, 4, 8, 12);
  ctx.fillStyle='#c0a0b0';
  ctx.fillRect(-20, 6, 4, 8);
  ctx.fillRect(16, 6, 4, 8);

  // Cabeza
  ctx.fillStyle='#f0ede0';
  ctx.fillRect(-14, 0, 28, 24);

  // Ojos
  ctx.fillStyle='#000';
  ctx.fillRect(-10, 7, 8, 8);
  ctx.fillRect(2, 7, 8, 8);
  ctx.fillStyle='#9955cc';
  ctx.fillRect(-9, 8, 6, 6);
  ctx.fillRect(3, 8, 6, 6);
  ctx.fillStyle='#fff';
  ctx.fillRect(-7, 9, 2, 2);
  ctx.fillRect(5, 9, 2, 2);

  // Nariz
  ctx.fillStyle='#cc3355';
  ctx.fillRect(-2, 17, 4, 2);

  // Boca
  ctx.fillStyle='#000';
  ctx.fillRect(-6, 20, 12, 2);
  ctx.fillRect(-8, 18, 4, 2);
  ctx.fillRect(4, 18, 4, 2);

  // Cuello
  ctx.fillStyle='#e8c890';
  ctx.fillRect(-4, 24, 8, 5);

  // Túnica — cuerpo
  ctx.fillStyle='#7744bb';
  ctx.fillRect(-16, 28, 32, 36);
  ctx.fillStyle='#5522aa';
  ctx.fillRect(-16, 28, 5, 36);
  ctx.fillRect(11, 28, 5, 36);
  ctx.fillStyle='#ccaaee';
  ctx.fillRect(-8, 34, 16, 14);
  ctx.fillStyle='#cc2244';
  ctx.fillRect(-4, 37, 8, 8);

  // Mangas
  ctx.fillStyle='#6633aa';
  ctx.fillRect(-24, 29, 10, 20);
  ctx.fillRect(14, 29, 10, 20);

  // Manos
  ctx.fillStyle='#e8c890';
  ctx.fillRect(-26, 48, 8, 8);
  ctx.fillRect(18, 48, 8, 8);

  // Falda
  ctx.fillStyle='#8855cc';
  ctx.fillRect(-18, 62, 36, 18);
  ctx.fillStyle='#6633aa';
  for(let i=0;i<4;i++) ctx.fillRect(-14+i*10, 62, 3, 18);

  // Pies
  ctx.fillStyle='#111';
  ctx.fillRect(-12, 78, 10, 4);
  ctx.fillRect(2, 78, 10, 4);

  // Contorno negro
  ctx.strokeStyle='#000'; ctx.lineWidth=0.8;
  ctx.strokeRect(-14, 0, 28, 24);
  ctx.strokeRect(-16, 28, 32, 36);
  ctx.strokeRect(-18, 62, 36, 18);

  ctx.restore();
}

// ═══════════════════════════════════════════════
//  FONDO — paredes de piedra ruinas
// ═══════════════════════════════════════════════
function drawBackground() {
  ctx.fillStyle='#0d0d18';
  ctx.fillRect(0, 0, 640, 200);

  ctx.strokeStyle='#2a2a3a'; ctx.lineWidth=1.5;
  const bw=40, bh=32;
  for(let row=0;row<7;row++){
    const off=(row%2)*20;
    for(let col=-1;col<17;col++){
      const rx=col*bw+off, ry=row*bh;
      ctx.fillStyle= row%3===0?'#111120':'#0e0e1a';
      ctx.fillRect(rx,ry,bw,bh);
      ctx.strokeRect(rx,ry,bw,bh);
      ctx.fillStyle='rgba(0,0,0,0.4)';
      ctx.fillRect(rx+1,ry+1,bw-2,2);
      ctx.fillRect(rx+1,ry+1,2,bh-2);
    }
  }

  ctx.fillStyle='#181828';
  ctx.fillRect(0, 192, 640, 16);
  ctx.strokeStyle='#333';
  ctx.strokeRect(0,192,640,16);

  ctx.strokeStyle='#1a1a2e'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(320,192); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(640,0); ctx.lineTo(320,192); ctx.stroke();

  const g=ctx.createRadialGradient(320,130,10,320,130,120);
  g.addColorStop(0,'rgba(100,60,160,0.35)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,640,200);
}

// ═══════════════════════════════════════════════
//  BATTLE BOX
// ═══════════════════════════════════════════════
const BOX = { x:160, y:215, w:320, h:130 };

function drawBox() {
  ctx.fillStyle=BLACK;
  ctx.fillRect(BOX.x, BOX.y, BOX.w, BOX.h);
  ctx.strokeStyle=WHITE; ctx.lineWidth=4;
  ctx.strokeRect(BOX.x, BOX.y, BOX.w, BOX.h);
}

// ═══════════════════════════════════════════════
//  HEART
// ═══════════════════════════════════════════════
let hx = BOX.x + BOX.w/2, hy = BOX.y + BOX.h/2;
let invincible=false, invTimer=0;

function drawHeart() {
  if(invincible && Math.floor(Date.now()/80)%2===0) return;
  ctx.save();
  ctx.fillStyle=RED;
  ctx.translate(hx, hy);
  ctx.scale(0.7, 0.7);
  ctx.beginPath();
  ctx.moveTo(0, 6);
  ctx.bezierCurveTo(-10, -2, -18, -10, -10, -16);
  ctx.bezierCurveTo(-4, -22, 0, -16, 0, -12);
  ctx.bezierCurveTo(0, -16, 4, -22, 10, -16);
  ctx.bezierCurveTo(18, -10, 10, -2, 0, 6);
  ctx.fill();
  ctx.restore();
}

// ═══════════════════════════════════════════════
//  DIALOGUE BOX
// ═══════════════════════════════════════════════
let dlgText='', dlgFull='', dlgTimer=0, dlgDone=false, dlgCB=null;

function startDialogue(text, cb) {
  dlgFull=text; dlgText=''; dlgTimer=0; dlgDone=false; dlgCB=cb;
  phase='dialogue';
}

function updateDialogue() {
  if (dlgDone) return;

  dlgTimer++;
  if(dlgTimer % 4 === 0 && dlgText.length < dlgFull.length) {
    dlgText += dlgFull[dlgText.length];
    
    if(dlgText.length === dlgFull.length) {
      dlgDone=true;
      
      const clonSonido = sonidoLetras.cloneNode();
      clonSonido.volume = 0.5;
      clonSonido.play().catch(() => {});

      if(dlgCB) setTimeout(dlgCB, 1500);
    }
  }
}

function drawDialogue() {
  ctx.fillStyle=BLACK;
  ctx.fillRect(40, 348, 560, 72);
  ctx.strokeStyle=WHITE; ctx.lineWidth=4;
  ctx.strokeRect(40, 348, 560, 72);

  ctx.fillStyle=WHITE;
  font(10);
  ctx.textBaseline='top';
  const lines = dlgText.split('\n');
  lines.forEach((l,i) => ctx.fillText(l, 56, 360+i*22));
}

// ═══════════════════════════════════════════════
//  HP BAR — Vida máxima reducida a 60
// ═══════════════════════════════════════════════
const PMAX=60, BMAX=80;
let pHP=PMAX, bHP=BMAX;

function drawHPArea() {
  ctx.fillStyle=WHITE; font(9); ctx.textBaseline='middle';
  ctx.fillText('❤ Mely  LV 1', 42, 432);

  ctx.fillStyle=YELLOW;
  ctx.fillText('HP', 280, 432);

  const bx=305, by=425, bw=200, bh=14;
  ctx.fillStyle=BLACK; ctx.fillRect(bx,by,bw,bh);
  ctx.strokeStyle=WHITE; ctx.lineWidth=2; ctx.strokeRect(bx,by,bw,bh);
  ctx.fillStyle=YELLOW;
  ctx.fillRect(bx+1,by+1, (bw-2)*Math.max(0,pHP/PMAX), bh-2);

  ctx.fillStyle=YELLOW; font(9);
  ctx.fillText(Math.max(0,pHP)+' / '+PMAX, 514, 432);
}

// ═══════════════════════════════════════════════
//  MENU — Reconfigurado sin ACT y con RENDIDOR
// ═══════════════════════════════════════════════
let menuEnabled = false;

// Array de botones adaptado (FIGHT, ITEM, MERCY expandidos simétricamente)
const btns = [
  {x:42,  y:448, w:170, h:26, label:'⚔ FIGHT'},
  {x:232, y:448, w:170, h:26, label:'🎒 ITEM'},
  {x:422, y:448, w:176, h:26, label:'♡ RENDIDOR'}, // Mercy pasa a ser rendirse
];

function drawMenu() {
  btns.forEach((b,i)=>{
    const hover = (mx>=b.x && mx<=b.x+b.w && my>=b.y && my<=b.y+b.h && menuEnabled);
    ctx.fillStyle = hover ? WHITE : BLACK;
    ctx.strokeStyle = menuEnabled ? WHITE : DKGRAY;
    ctx.lineWidth=2.5;
    ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.strokeRect(b.x,b.y,b.w,b.h);
    ctx.fillStyle = hover ? BLACK : (menuEnabled ? WHITE : DKGRAY);
    font(9); ctx.textBaseline='middle';
    ctx.fillText(b.label, b.x+12, b.y+13);
  });
}

// Mouse pos y clicks
let mx=0, my=0;
C.addEventListener('mousemove', e=>{
  const r=C.getBoundingClientRect();
  mx=(e.clientX-r.left)*(C.width/r.width);
  my=(e.clientY-r.top)*(C.height/r.height);
});
C.addEventListener('click', e=>{
  const r=C.getBoundingClientRect();
  const cx=(e.clientX-r.left)*(C.width/r.width);
  const cy=(e.clientY-r.top)*(C.height/r.height);
  if(!menuEnabled) return;
  
  // Procesar clicks según la nueva distribución de botones
  if(cx>=btns[0].x && cx<=btns[0].x+btns[0].w && cy>=448 && cy<=474) openFight();
  if(cx>=btns[1].x && cx<=btns[1].x+btns[1].w && cy>=448 && cy<=474) openItem();
  if(cx>=btns[2].x && cx<=btns[2].x+btns[2].w && cy>=448 && cy<=474) doSurrender();
});

// ═══════════════════════════════════════════════
//   FIREBALLS
// ═══════════════════════════════════════════════
let fireballs = [];
let patternIntervals = []; 
const MAX_BOLAS = 12;

function spawnFireballs(pattern) {
  fireballs = [];
  patternIntervals.forEach(clearInterval);
  patternIntervals = [];

  if(pattern === 0) {
    for(let i=0; i<5; i++) {
      fireballs.push({
        x: BOX.x + 30 + Math.random()*(BOX.w-60),
        y: BOX.y + 15 + Math.random()*25, 
        vx: (0.45 + Math.random()*0.3) * (Math.random()<.5?1:-1),
        vy: (0.4 + Math.random()*0.25),
        r: 9, type:'bounce', color:'#ff6600', glow:'#ff3300'
      });
    }
  } 
  else if(pattern === 1) {
    const lanzarOleadaLluvia = () => {
      if (phase !== 'enemy' || fireballs.length >= MAX_BOLAS) return;
      const columnaHueco = Math.floor(Math.random() * 6);
      const cols = [0, 1, 2, 3, 4, 5];

      cols.forEach((c, i) => {
        if(c === columnaHueco) return;
        setTimeout(() => {
          if(phase === 'enemy' && fireballs.length < MAX_BOLAS) {
            fireballs.push({
              x: BOX.x + 18 + c * (BOX.w/6) + Math.random()*15,
              y: BOX.y - 20, 
              vx: 0, vy: 0.9, 
              r: 10, type:'fall', color:'#ff5500', glow:'#ff2200'
            });
          }
        }, i * 80);
      });
    };

    setTimeout(() => {
      if(phase === 'enemy') {
        lanzarOleadaLluvia();
        const intervaloLluvia = setInterval(lanzarOleadaLluvia, 3000);
        patternIntervals.push(intervaloLluvia);
      }
    }, 1000);
  } 
  else if(pattern === 2) {
    const lanzarBolaDirigida = () => {
      if(phase !== 'enemy' || fireballs.length >= MAX_BOLAS) return;

      const side = Math.floor(Math.random()*4);
      let fx, fy;
      if(side === 0){ fx=BOX.x+Math.random()*BOX.w; fy=BOX.y; }
      else if(side === 1){ fx=BOX.x+BOX.w; fy=BOX.y+Math.random()*BOX.h; }
      else if(side === 2){ fx=BOX.x+Math.random()*BOX.w; fy=BOX.y+BOX.h; }
      else { fx=BOX.x; fy=BOX.y+Math.random()*BOX.h; }
      
      const ang = Math.atan2(hy-fy, hx-fx);
      fireballs.push({
        x: fx, y: fy,
        vx: Math.cos(ang)*0.95, vy: Math.sin(ang)*0.95,
        r: 11, type:'aimed', color:'#ff8800', glow:'#ff5500'
      });
    };

    setTimeout(() => {
      if(phase === 'enemy') {
        lanzarBolaDirigida();
        const intervaloDirigidas = setInterval(lanzarBolaDirigida, 2000);
        patternIntervals.push(intervaloDirigidas);
      }
    }, 1000);
  }
}

function addRandomFireball(pattern) {
  if(pattern === 0 && fireballs.length < MAX_BOLAS){
    fireballs.push({
      x: BOX.x+20+Math.random()*(BOX.w-40), y: BOX.y+5,
      vx: (0.5+Math.random()*0.25)*(Math.random()<.5?1:-1),
      vy: 0.55+Math.random()*0.2,
      r: 9, type:'bounce', color:'#ff6600', glow:'#ff3300'
    });
  }
}

function updateFireballs(){
  fireballs.forEach(f=>{
    f.x+=f.vx; f.y+=f.vy;
    if(f.type==='bounce'){
      if(f.x-f.r<BOX.x){f.x=BOX.x+f.r;f.vx*=-1;}
      if(f.x+f.r>BOX.x+BOX.w){f.x=BOX.x+BOX.w-f.r;f.vx*=-1;}
      if(f.y-f.r<BOX.y){f.y=BOX.y+f.r;f.vy*=-1;}
      if(f.y+f.r>BOX.y+BOX.h){f.y=BOX.y+BOX.h-f.r;f.vy*=-1;}
    } else {
      if(f.x<BOX.x-40||f.x>BOX.x+BOX.w+40||f.y<BOX.y-40||f.y>BOX.y+BOX.h+40) f.dead = true;
    }
    
    if(!invincible){
      const dx=f.x-hx, dy=f.y-hy;
      if(Math.sqrt(dx*dx+dy*dy)<f.r+10){
        pHP=Math.max(0,pHP-6);
        invincible=true; invTimer=60;
      }
    }
  });
  if(invincible){invTimer--;if(invTimer<=0)invincible=false;}
  fireballs=fireballs.filter(f=>!f.dead);
}

function drawFireballs(){
  fireballs.forEach(f=>{
    ctx.save();
    const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r*2.5);
    g.addColorStop(0,f.color+'cc');
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(f.x,f.y,f.r*2.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=f.color;
    ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff8';
    ctx.beginPath(); ctx.arc(f.x-f.r*.3,f.y-f.r*.3,f.r*.35,0,Math.PI*2); ctx.fill();
    ctx.restore();
  });
}

// ═══════════════════════════════════════════════
//  FIGHT BAR
// ═══════════════════════════════════════════════
let fightOpen=false, fCursorX=0, fCursorDir=1, fZoneL=0, fZoneW=0;

function drawFightBar() {
  if(!fightOpen) return;
  ctx.fillStyle=BLACK;
  ctx.fillRect(BOX.x,BOX.y,BOX.w,BOX.h);

  font(10); ctx.fillStyle=WHITE; ctx.textBaseline='middle';
  ctx.fillText('¡PULSA ESPACIO!', BOX.x+BOX.w/2-70, BOX.y+40);

  const tx=BOX.x+20, ty=BOX.y+65, tw=BOX.w-40, th=22;
  ctx.fillStyle='#222'; ctx.fillRect(tx,ty,tw,th);
  ctx.strokeStyle=WHITE; ctx.lineWidth=2; ctx.strokeRect(tx,ty,tw,th);
  ctx.fillStyle='#ff444433';
  ctx.fillRect(tx+fZoneL,ty,fZoneW,th);
  ctx.strokeStyle='#ff4444'; ctx.lineWidth=1.5;
  ctx.strokeRect(tx+fZoneL,ty,fZoneW,th);
  ctx.fillStyle=YELLOW;
  ctx.fillRect(tx+fCursorX,ty,14,th);
}

// ═══════════════════════════════════════════════
//  SUBMENU (ITEM)
// ═══════════════════════════════════════════════
let subOpen=false, subType='', subItems=[], subCB=null;

C.addEventListener('click', e=>{
  if(!subOpen) return;
  const r=C.getBoundingClientRect();
  const cx=(e.clientX-r.left)*(C.width/r.width);
  const cy=(e.clientY-r.top)*(C.height/r.height);
  if(cx>=BOX.x+BOX.w/2-50&&cx<=BOX.x+BOX.w/2+50&&cy>=BOX.y+BOX.h-28&&cy<=BOX.y+BOX.h-8){
    subOpen=false; return;
  }
  subItems.forEach((it,i)=>{
    const iy=BOX.y+20+i*32;
    if(cy>=iy&&cy<=iy+24&&cx>=BOX.x+20&&cx<=BOX.x+BOX.w-20){
      subOpen=false;
      if(subCB) subCB(it);
    }
  });
});

function drawSubMenu(){
  if(!subOpen) return;
  ctx.fillStyle=BLACK;
  ctx.fillRect(BOX.x,BOX.y,BOX.w,BOX.h);
  ctx.fillStyle=WHITE; font(10); ctx.textBaseline='top';
  ctx.fillText('— '+subType+' —', BOX.x+20, BOX.y+8);
  subItems.forEach((it,i)=>{
    const iy=BOX.y+28+i*30;
    const hover=(mx>=BOX.x+20&&mx<=BOX.x+BOX.w-20&&my>=iy&&my<=iy+24);
    ctx.fillStyle=hover?'#333':'#111';
    ctx.fillRect(BOX.x+20,iy,BOX.w-40,24);
    ctx.strokeStyle=hover?WHITE:'#444'; ctx.lineWidth=1.5;
    ctx.strokeRect(BOX.x+20,iy,BOX.w-40,24);
    ctx.fillStyle=WHITE; font(9); ctx.textBaseline='middle';
    ctx.fillText(it.label, BOX.x+30, iy+12);
  });
  const vy=BOX.y+BOX.h-28;
  ctx.fillStyle='#111'; ctx.fillRect(BOX.x+BOX.w/2-50,vy,100,20);
  ctx.strokeStyle=GRAY; ctx.lineWidth=1; ctx.strokeRect(BOX.x+BOX.w/2-50,vy,100,20);
  ctx.fillStyle=GRAY; font(8); ctx.textBaseline='middle';
  ctx.fillText('◄ VOLVER', BOX.x+BOX.w/2-32, vy+10);
}

// ═══════════════════════════════════════════════
//  GAME STATE
// ═══════════════════════════════════════════════
let phase='dialogue';
let enemyPattern=0, enemyTicks=0, enemyDuration=1000;
let bobY=0, bobDir=1, bobT=0;
let hitFlash=0;
let battleMsgIdx=0;

const DIALOGUES_INTRO=[
  '* Toriel bloquea el camino!\n* "No puedo dejarte pasar."',
  '* "Este lugar es peligroso.\n Por favor... déjame cuidarte."',
  '* Toriel adopta una postura\n de combate.',
];
const DIALOGUES_BATTLE=[
  '* "¿Por qué no te detienes...?"',
  '* Toriel parece triste pero firme.',
  '* "¡Aún puedo mantenerte aquí!"',
  '* Toriel te mira fijamente.',
  '* "Por favor... no me obligues."',
];
let introIdx=0;

// ── KEYS ──
const keys={};
document.addEventListener('keydown',e=>{
  keys[e.key]=true;
  if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();

  if(e.key===' '&&fightOpen){
    fightOpen=false;
    const tw=BOX.w-40;
    const hit=fCursorX>=fZoneL&&fCursorX<=fZoneL+fZoneW;
    const dmg=hit?(12+Math.floor(Math.random()*10)):(1+Math.floor(Math.random()*4));
    bHP=Math.max(0,bHP-dmg);
    hitFlash=20;
    const msg=hit?`¡GOLPE! -${dmg} HP`:`Rozó... -${dmg} HP`;
    setTimeout(()=>{
      if(bHP<=0){ victory(); return; }
      startEnemy();
    },600);
    dlgText='* '+msg; dlgFull=msg; dlgDone=true;
  }
});
document.addEventListener('keyup',e=>keys[e.key]=false);

// ═══════════════════════════════════════════════
//  ACTIONS
// ═══════════════════════════════════════════════
function openFight(){
  if(!menuEnabled) return;
  menuEnabled=false;
  fightOpen=true; fCursorX=0; fCursorDir=1;
  const tw=BOX.w-40;
  fZoneW=76;
  fZoneL=20+Math.random()*(tw-fZoneW-40);
}

// Función de rendirse: Reinicia el juego inmediatamente
function doSurrender(){
  if(!menuEnabled) return;
  menuEnabled=false;
  location.reload(); 
}

function startEnemy(){
  phase='enemy';
  menuEnabled=false;
  enemyPattern=Math.floor(Math.random()*3);
  enemyTicks=0;
  spawnFireballs(enemyPattern);
}

function nextIntro(){
  if(introIdx<DIALOGUES_INTRO.length){
    startDialogue(DIALOGUES_INTRO[introIdx++], nextIntro);
  } else {
    phase='menu'; menuEnabled=true;
    dlgText='* ¿Qué harás?'; dlgFull='* ¿Qué harás?'; dlgDone=true;
  }
}
nextIntro();

// ═══════════════════════════════════════════════
//  VICTORY / GAME OVER
// ═══════════════════════════════════════════════
let endPhase='', endMsg='', endSub='', endBtn='';
function victory(){
  musica.pause();
  phase='end';
  menuEnabled=false;
  ganarDinero(100);
  
  endPhase='win';
  endMsg='¡VICTORIA!';
  endSub='¡Derrotaste a Toriel!';
  endBtn='► CONTINUAR';

  // Guardado seguro
  try {
    let p = JSON.parse(localStorage.getItem('dificil_levels')) || { "completed": [] };
    if (!p.completed.includes(1)) {
        p.completed.push(1);
    }
    localStorage.setItem('dificil_levels', JSON.stringify(p));
  } catch(e) {
    console.error("Error al guardar:", e);
  }
}
function gameOver(){
  musica.pause();

  phase='end';
  endPhase='lose';
  endMsg='GAME OVER';
  endSub='Toriel te ha derrotado...';
  endBtn='► REINTENTAR';
}

function drawEndScreen(){
  ctx.fillStyle='rgba(0,0,0,0.88)';
  ctx.fillRect(0,0,640,480);
  ctx.textAlign='center';
  ctx.fillStyle=endPhase==='win'?YELLOW:RED;
  font(28); ctx.textBaseline='middle';
  ctx.fillText(endMsg,320,180);
  ctx.fillStyle=WHITE; font(10);
  ctx.fillText(endSub,320,230);
  const bx=220,by=270,bw=200,bh=32;
  const hover=mx>=bx&&mx<=bx+bw&&my>=by&&my<=by+bh;
  ctx.fillStyle=hover?WHITE:BLACK;
  ctx.strokeStyle=WHITE; ctx.lineWidth=3;
  ctx.fillRect(bx,by,bw,bh); ctx.strokeRect(bx,by,bw,bh);
  ctx.fillStyle=hover?BLACK:WHITE; font(10);
  ctx.fillText(endBtn,320,by+16);
  ctx.textAlign='left';
}

C.addEventListener('click',e=>{
  if(phase!=='end') return;
  const r=C.getBoundingClientRect();
  const cx=(e.clientX-r.left)*(C.width/r.width);
  const cy=(e.clientY-r.top)*(C.height/r.height);
  if(cx>=220&&cx<=420&&cy>=270&&cy<=302){
    if(endPhase==='lose') location.reload();
    else window.location.href='dificil.html';
  }
});

// ═══════════════════════════════════════════════
//  MAIN LOOP
// ═══════════════════════════════════════════════
function update(){
  boxT=window.bobT || 0; // Fix menor para asegurar retrocompatibilidad en loops intensos
  bobT++;
  if(bobT%5===0){ bobY+=bobDir; if(bobY>=5||bobY<=0) bobDir*=-1; }
  if(hitFlash>0) hitFlash--;

  if(phase==='dialogue') updateDialogue();

  if(phase==='enemy'){
    enemyTicks++;
    const spd=1;
    if(keys['ArrowLeft'])     hx=Math.max(BOX.x+12,hx-spd);
    if(keys['ArrowRight'])    hx=Math.min(BOX.x+BOX.w-12,hx+spd);
    if(keys['ArrowUp'])       hy=Math.max(BOX.y+12,hy-spd);
    if(keys['ArrowDown'])     hy=Math.min(BOX.y+BOX.h-12,hy+spd);

    if(enemyTicks%90===0) addRandomFireball(enemyPattern);

    updateFireballs();

    if(pHP<=0){ gameOver(); return; }

    if(enemyTicks>=enemyDuration){
      fireballs=[];
      const msg=DIALOGUES_BATTLE[battleMsgIdx%DIALOGUES_BATTLE.length]; battleMsgIdx++;
      startDialogue(msg, ()=>{
        phase='menu'; menuEnabled=true;
        dlgText='* ¿Qué harás?'; dlgFull='* ¿Qué harás?'; dlgDone=true;
      });
    }
  }

  if(fightOpen){
    const tw=BOX.w-40;
    fCursorX+=fCursorDir*3.2;
    if(fCursorX>=tw-14) fCursorDir=-1;
    if(fCursorX<=0) fCursorDir=1;
  }
}

function draw(){
  ctx.clearRect(0,0,640,480);

  drawBackground();
  drawToriel(320, 90, bobY, hitFlash>0);
  drawBox();

  if(phase==='enemy'||phase==='menu'||phase==='dialogue'){
    if(!fightOpen && !subOpen) drawFireballs();
    drawHeart();
  }
  drawFightBar();
  drawSubMenu();
  drawDialogue();
  drawHPArea();
  drawMenu();

  if(phase==='end') drawEndScreen();
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
